name: Build OpenTaiko Hub

on:
  # Every branch is checked, so a branch's Linux code is compiled and tested before it is
  # merged: limited to main, the merge was the first time, and a failure there blocked
  # publishing. Publishing is limited to main (see `version`).
  push:
    branches:
      - '**'
  # Pull requests run the checks only
  pull_request:
  # Publishes the current version again, replacing the files of its release
  workflow_dispatch:

# Runs of main take turns, so two pushes made before a version is released cannot both
# publish it, the second uploading its files under the first one's tag. Other branches
# only run the checks, and a newer push cancels the run of the one before.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Actions are pinned to a commit, with the release it was in alongside: a tag can be moved
# to other code, and the release job holds a token that can write releases.
jobs:
    # Nothing is published unless the type check, the frontend tests, clippy and the Rust
    # tests pass, on both systems the Hub ships for. Linux in particular: its code paths
    # are not exercised on a Windows development machine.
    check:
        permissions:
          contents: read
        strategy:
          fail-fast: false
          matrix:
            platform: ['ubuntu-22.04', 'windows-latest']

        runs-on: ${{ matrix.platform }}
        steps:
          - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            with:
              persist-credentials: false

          - name: install dependencies (ubuntu only)
            if: matrix.platform == 'ubuntu-22.04'
            run: |
              sudo apt-get update
              sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

          - name: setup node
            uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
            with:
              node-version: lts/*
              cache: 'npm'

          # A fixed Rust version: lints added by a newer one would otherwise fail clippy
          # below, and so block publishing, with nothing changed in this repository.
          - name: install Rust
            uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
            with:
              toolchain: 1.97.0
              components: clippy

          # Saved from main only: every branch saving its own pushed main's caches out of
          # the repository's 10 GB, and branches restore main's
          - name: Rust cache
            uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
            with:
              workspaces: './src-tauri -> target'
              save-if: ${{ github.ref == 'refs/heads/main' }}

          # Without install scripts: none of the packages needs one to work (es5-ext only
          # prints a message, esbuild under svelte-i18n only checks its binary), and they
          # are code from every dependency run with the job's token at hand
          - name: install frontend dependencies
            run: npm ci --ignore-scripts

          - name: type check
            run: npm run check

          - name: frontend tests
            run: npm test

          # The Rust build embeds the built frontend
          - name: build frontend
            run: npm run build

          - name: clippy
            working-directory: src-tauri
            run: cargo clippy --all-targets -- -D warnings

          # Code only installed builds run (where the Hub keeps its data, moving Linux and
          # macOS data out of Documents) is compiled out of the debug build above, and was
          # otherwise first compiled by the publish job.
          - name: clippy (release)
            working-directory: src-tauri
            run: cargo clippy --release --all-targets -- -D warnings

          - name: Rust tests
            working-directory: src-tauri
            run: cargo test

    # A push publishes only a version that has no complete release yet. The release step
    # tags the version, and every later push to main used to replace the files of a
    # release users had already downloaded. Bumping the version publishes; running the
    # workflow by hand on main publishes the current version again.
    version:
        needs: check
        # Run by hand on another branch, it replaced the live release's files with that
        # branch's build, under a tag still pointing at main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        permissions:
          contents: read
        runs-on: ubuntu-22.04
        outputs:
          publish: ${{ steps.gate.outputs.publish }}
          version: ${{ steps.gate.outputs.version }}
          # The runners to build on, as JSON, and the commit to build
          platforms: ${{ steps.gate.outputs.platforms }}
          ref: ${{ steps.gate.outputs.ref }}
        steps:
          - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            with:
              persist-credentials: false

          # A release counts once it holds the Windows installer and both Linux packages: a
          # first publish whose Linux leg failed used to count as released, and its release
          # never got them. What it lacks is built again from its tag, and nothing else:
          # rebuilt from main, the Windows installer users had was replaced by code the tag
          # does not point at. Only a 404 means there is no release: `gh release view` also
          # says "release not found" when GitHub fails to answer, and any failure counted as
          # unreleased published over a release users had already downloaded.
          - id: gate
            env:
              GH_TOKEN: ${{ github.token }}
            run: |
              version=$(jq -r .version src-tauri/tauri.conf.json)
              echo "version=$version" >> "$GITHUB_OUTPUT"
              both='["ubuntu-22.04","windows-latest"]'
              if ! assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" --jq '.assets[].name' 2> "$RUNNER_TEMP/lookup-error.txt"); then
                if ! grep -q "(HTTP 404)" "$RUNNER_TEMP/lookup-error.txt"; then
                  cat "$RUNNER_TEMP/lookup-error.txt"
                  echo "::error::Could not tell whether v$version is released"
                  exit 1
                fi
                echo "Publishing v$version"
                { echo "publish=true"; echo "platforms=$both"; echo "ref=$GITHUB_SHA"; } >> "$GITHUB_OUTPUT"
                exit 0
              fi
              has() { printf '%s\n' "$assets" | grep -q -- "$1\$"; }
              missing=()
              has -setup.exe || missing+=('"windows-latest"')
              { has .deb && has .AppImage; } || missing+=('"ubuntu-22.04"')
              if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
                echo "Publishing v$version again on request, from its tag"
                { echo "publish=true"; echo "platforms=$both"; echo "ref=refs/tags/v$version"; } >> "$GITHUB_OUTPUT"
              elif [ ${#missing[@]} -gt 0 ]; then
                list=$(IFS=,; echo "[${missing[*]}]")
                echo "::warning::v$version is released without the files built on $list; building those from its tag"
                { echo "publish=true"; echo "platforms=$list"; echo "ref=refs/tags/v$version"; } >> "$GITHUB_OUTPUT"
              else
                echo "::notice::v$version is already released. Bump the version in src-tauri/tauri.conf.json, src-tauri/Cargo.toml and package.json to publish."
                echo "publish=false" >> "$GITHUB_OUTPUT"
              fi

    # Builds without any token that can write: the build runs code from every dependency
    # (build scripts, bundler plugins), which used to run with the release token in its
    # environment. The files go to the `release` job as artifacts.
    build:
        needs: version
        if: needs.version.outputs.publish == 'true'
        permissions:
          contents: read
        strategy:
          fail-fast: false
          matrix:
            platform: ${{ fromJSON(needs.version.outputs.platforms) }}

        runs-on: ${{ matrix.platform }}
        steps:
          - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            with:
              ref: ${{ needs.version.outputs.ref }}
              persist-credentials: false

          - name: install dependencies (ubuntu only)
            if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
            run: |
              sudo apt-get update
              sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
              # Each `run:` block is its own shell, so an `export` here would die with it
              # and never reach the build step. NO_STRIP keeps linuxdeploy from stripping
              # the AppImage's bundled libraries, which users had to do by hand to make
              # the AppImage start (issue #4).
              echo "NO_STRIP=true" >> "$GITHUB_ENV"

          - name: setup node
            uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
            with:
              node-version: lts/*
              cache: 'npm' # Set this to npm, yarn or pnpm.

          # The same Rust version the checks ran with
          - name: install Rust
            uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
            with:
              toolchain: 1.97.0
              # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
              targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

          - name: Rust cache
            uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
            with:
              workspaces: './src-tauri -> target'

          - name: install frontend dependencies
            # If you don't have `beforeBuildCommand` configured you may want to build your frontend here too.
            # `ci` installs exactly the locked versions. The Tauri CLI decides the deb's
            # dependency list, so an unpinned bump silently changes what the package requires.
            # No install scripts, as in the checks.
            run: npm ci --ignore-scripts

          # The bundles tauri.conf.json asks for: the NSIS installer on Windows, the deb and
          # the AppImage on Linux
          - name: build
            run: npm run tauri build

          - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
            with:
              name: bundle-${{ matrix.platform }}
              path: |
                src-tauri/target/release/bundle/nsis/*-setup.exe
                src-tauri/target/release/bundle/deb/*.deb
                src-tauri/target/release/bundle/appimage/*.AppImage
              if-no-files-found: error
              retention-days: 7

    # The only job that can write releases, and it runs nothing but `gh`. A build that
    # failed on one system does not hold back the other's files: the gate then builds
    # only what is missing, on the next push.
    release:
        needs: [version, build]
        if: ${{ !cancelled() && needs.version.outputs.publish == 'true' }}
        permissions:
          contents: write
        # Two runs uploading to the same release take turns
        concurrency:
          group: release
          cancel-in-progress: false
        runs-on: ubuntu-22.04
        steps:
          - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
            with:
              pattern: bundle-*
              path: bundles
              merge-multiple: true

          # The artifacts keep the bundle folders (nsis/, deb/, appimage/): with several
          # paths, upload-artifact roots them at their common parent. The files are moved
          # out of them first: handed the folders, the upload failed and left an empty
          # release. A new release is created with its files in one step, so it is never
          # public without them (gh uploads to a draft, then publishes it).
          - env:
              GH_TOKEN: ${{ github.token }}
              TAG: v${{ needs.version.outputs.version }}
            run: |
              cd bundles
              find . -mindepth 2 -type f -exec mv -t . -- {} +
              find . -mindepth 1 -type d -empty -delete
              # Spaces become dots, as in the file names of earlier releases
              for file in *; do
                [ "$file" = "${file// /.}" ] || mv -- "$file" "${file// /.}"
              done
              ls -la
              if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > /dev/null 2> "$RUNNER_TEMP/lookup-error.txt"; then
                gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber -- *
              elif grep -q "(HTTP 404)" "$RUNNER_TEMP/lookup-error.txt"; then
                gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                  --title "OpenTaiko Hub $TAG" \
                  --notes "Linux builds are considered functional from 0.1.5, please update if your version is older." \
                  -- *
              else
                cat "$RUNNER_TEMP/lookup-error.txt"
                exit 1
              fi
