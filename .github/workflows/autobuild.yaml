name: Build OpenTaiko Hub

on: 
  push:
    branches:
      - main
  # Pull requests run the checks only; publishing is limited to pushes to main
  pull_request:
  
jobs:
    # Nothing is published unless the type check, the frontend tests, clippy and the Rust
    # tests pass, on both systems the Hub ships for. Linux in particular: its code paths
    # are not exercised on a Windows development machine.
    check:
        permissions:
          contents: read
        strategy:
          fail-fast: false
          matrix:
            platform: ['ubuntu-22.04', 'windows-latest']

        runs-on: ${{ matrix.platform }}
        steps:
          - uses: actions/checkout@v4

          - name: install dependencies (ubuntu only)
            if: matrix.platform == 'ubuntu-22.04'
            run: |
              sudo apt-get update
              sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

          - name: setup node
            uses: actions/setup-node@v4
            with:
              node-version: lts/*
              cache: 'npm'

          - name: install Rust stable
            uses: dtolnay/rust-toolchain@stable
            with:
              components: clippy

          - name: Rust cache
            uses: swatinem/rust-cache@v2
            with:
              workspaces: './src-tauri -> target'

          - name: install frontend dependencies
            run: npm ci

          - name: type check
            run: npm run check

          - name: frontend tests
            run: npm test

          # The Rust build embeds the built frontend
          - name: build frontend
            run: npm run build

          - name: clippy
            working-directory: src-tauri
            run: cargo clippy --all-targets -- -D warnings

          - name: Rust tests
            working-directory: src-tauri
            run: cargo test

    publish:
        needs: check
        if: github.event_name == 'push'
        permissions:
          contents: write
        strategy:
          fail-fast: false
          matrix:
            include:
              - platform: 'ubuntu-22.04'
                args: ''
              - platform: 'windows-latest'
                args: ''

        runs-on: ${{ matrix.platform }}
        steps:
          - uses: actions/checkout@v4

          - name: install dependencies (ubuntu only)
            if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
            run: |
              sudo apt-get update
              sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
              # Each `run:` block is its own shell, so an `export` here would die with it
              # and never reach the build step. NO_STRIP keeps linuxdeploy from stripping
              # the AppImage's bundled libraries, which users had to do by hand to make
              # the AppImage start (issue #4).
              echo "NO_STRIP=true" >> "$GITHUB_ENV"

          - name: setup node
            uses: actions/setup-node@v4
            with:
              node-version: lts/*
              cache: 'npm' # Set this to npm, yarn or pnpm.

          - name: install Rust stable
            uses: dtolnay/rust-toolchain@stable # Set this to dtolnay/rust-toolchain@nightly
            with:
              # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
              targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

          - name: Rust cache
            uses: swatinem/rust-cache@v2
            with:
              workspaces: './src-tauri -> target'

          - name: install frontend dependencies
            # If you don't have `beforeBuildCommand` configured you may want to build your frontend here too.
            # `ci` installs exactly the locked versions. The Tauri CLI decides the deb's
            # dependency list, so an unpinned bump silently changes what the package requires.
            run: npm ci

          - uses: tauri-apps/tauri-action@v0
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            with:
              tagName: v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
              releaseName: 'OpenTaiko Hub v__VERSION__'
              releaseBody: |
                Linux builds are considered functional from 0.1.5, please update if your version is older.
              releaseDraft: false
              prerelease: false
              args: ${{ matrix.args }}