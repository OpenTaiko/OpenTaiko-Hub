name: Build OpenTaiko Hub

on:
  push:
    branches:
      - main
  # Pull requests run the checks only; publishing is limited to pushes to main
  pull_request:
  # Publishes the current version again, replacing the files of its release
  workflow_dispatch:

# Actions are pinned to a commit, with the release it was in alongside: a tag can be moved
# to other code, and the publish job holds a token that can write releases.
jobs:
    # Nothing is published unless the type check, the frontend tests, clippy and the Rust
    # tests pass, on both systems the Hub ships for. Linux in particular: its code paths
    # are not exercised on a Windows development machine.
    check:
        permissions:
          contents: read
        strategy:
          fail-fast: false
          matrix:
            platform: ['ubuntu-22.04', 'windows-latest']

        runs-on: ${{ matrix.platform }}
        steps:
          - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

          - name: install dependencies (ubuntu only)
            if: matrix.platform == 'ubuntu-22.04'
            run: |
              sudo apt-get update
              sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

          - name: setup node
            uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
            with:
              node-version: lts/*
              cache: 'npm'

          # A fixed Rust version: lints added by a newer one would otherwise fail clippy
          # below, and so block publishing, with nothing changed in this repository.
          - name: install Rust
            uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
            with:
              toolchain: 1.97.0
              components: clippy

          - name: Rust cache
            uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
            with:
              workspaces: './src-tauri -> target'

          - name: install frontend dependencies
            run: npm ci

          - name: type check
            run: npm run check

          - name: frontend tests
            run: npm test

          # The Rust build embeds the built frontend
          - name: build frontend
            run: npm run build

          - name: clippy
            working-directory: src-tauri
            run: cargo clippy --all-targets -- -D warnings

          # Code only installed builds run (where the Hub keeps its data, moving Linux and
          # macOS data out of Documents) is compiled out of the debug build above, and was
          # otherwise first compiled by the publish job.
          - name: clippy (release)
            working-directory: src-tauri
            run: cargo clippy --release --all-targets -- -D warnings

          - name: Rust tests
            working-directory: src-tauri
            run: cargo test

    # A push publishes only a version that has no release yet. The release step tags the
    # version, and every later push to main used to replace the files of a release users
    # had already downloaded. Bumping the version publishes; running the workflow by hand
    # publishes the current version again.
    version:
        needs: check
        if: github.event_name != 'pull_request'
        permissions:
          contents: read
        runs-on: ubuntu-22.04
        outputs:
          publish: ${{ steps.gate.outputs.publish }}
        steps:
          - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

          - id: gate
            run: |
              version=$(jq -r .version src-tauri/tauri.conf.json)
              if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
                echo "Publishing v$version on request"
                echo "publish=true" >> "$GITHUB_OUTPUT"
              elif git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
                echo "::notice::v$version is already released. Bump the version in src-tauri/tauri.conf.json and package.json to publish."
                echo "publish=false" >> "$GITHUB_OUTPUT"
              else
                echo "Publishing v$version"
                echo "publish=true" >> "$GITHUB_OUTPUT"
              fi

    publish:
        needs: version
        if: needs.version.outputs.publish == 'true'
        permissions:
          contents: write
        # Two runs uploading to the same release take turns
        concurrency:
          group: publish-${{ matrix.platform }}
          cancel-in-progress: false
        strategy:
          fail-fast: false
          matrix:
            include:
              - platform: 'ubuntu-22.04'
                args: ''
              - platform: 'windows-latest'
                args: ''

        runs-on: ${{ matrix.platform }}
        steps:
          - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

          - name: install dependencies (ubuntu only)
            if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
            run: |
              sudo apt-get update
              sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
              # Each `run:` block is its own shell, so an `export` here would die with it
              # and never reach the build step. NO_STRIP keeps linuxdeploy from stripping
              # the AppImage's bundled libraries, which users had to do by hand to make
              # the AppImage start (issue #4).
              echo "NO_STRIP=true" >> "$GITHUB_ENV"

          - name: setup node
            uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
            with:
              node-version: lts/*
              cache: 'npm' # Set this to npm, yarn or pnpm.

          # The same Rust version the checks ran with
          - name: install Rust
            uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
            with:
              toolchain: 1.97.0
              # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
              targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

          - name: Rust cache
            uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
            with:
              workspaces: './src-tauri -> target'

          - name: install frontend dependencies
            # If you don't have `beforeBuildCommand` configured you may want to build your frontend here too.
            # `ci` installs exactly the locked versions. The Tauri CLI decides the deb's
            # dependency list, so an unpinned bump silently changes what the package requires.
            run: npm ci

          - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            with:
              tagName: v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
              releaseName: 'OpenTaiko Hub v__VERSION__'
              releaseBody: |
                Linux builds are considered functional from 0.1.5, please update if your version is older.
              releaseDraft: false
              prerelease: false
              args: ${{ matrix.args }}
