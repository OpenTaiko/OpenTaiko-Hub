[package]
name = "OpenTaiko-Hub"
version = "0.1.0"
description = "Update manager and launcher for OpenTaiko"
authors = ["OpenTaiko Team"]
license = ""
repository = ""
default-run = "OpenTaiko-Hub"
edition = "2021"
rust-version = "1.80"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "^2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "~2.11.5", features = [ ] }
tauri-plugin-fs = "~2.5.2"
tauri-plugin-http = "~2.6.0"
tauri-plugin-opener = "~2.5.5"
tauri-plugin-os = "~2.3.2"
zip = "4.2.0"
# download.rs: streams to disk (fs, io-util), runs transfers side by side (rt, sync), waits between retries (time)
tokio = { version = "1.51.1", features = ["fs", "io-util", "rt", "sync", "time"] }
tauri-plugin-dialog = "~2.7.3"
pelite = "0.10"
md-5 = "0.10"
sha1 = "0.10"
hex = "0.4"
encoding_rs = "0.8"
memchr = "2"
log = "0.4"
tauri-plugin-log = "~2.9.2"
# Resolves the log folder the same way Tauri does, so logging cannot abort startup.
dirs = "6"

# Linux-only: raising RLIMIT_NOFILE needs libc. Keep this target-scoped so Windows and
# macOS builds neither fetch nor compile it.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]

# Debug info is most of what makes target/ grow to tens of gigabytes: every dependency
# gets full symbols and a PDB on Windows, rebuilt into a new copy on every version or
# feature change. Our own crate keeps line tables, so panics and backtraces still name
# the file and line; dependencies get none, since nobody steps through Tauri's internals.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Smaller shipped binary. Symbols are stripped (a panic still logs its file and line:
# the panic hook reads those from the panic itself, not from symbols), and link-time
# optimisation across all crates removes the parts of the dependencies the Hub never
# calls. Release builds take longer for it. Panics keep unwinding: with "abort", one
# failing command would take the whole app down instead of failing alone.
[profile.release]
strip = true
lto = true
codegen-units = 1
