<!doctype html>
<html lang="en" data-theme="legacy" data-mode="dark">
	<head>
		<meta charset="utf-8" />
		<link id="themestyle" rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		%sveltekit.head%
	</head>
	<body id="themetarget" data-sveltekit-preload-data="hover" style="display: none;">
		<script>
			// The body starts hidden until the app applies its theme; if the app crashes
			// while booting, show the error instead of an eternal white screen.
			(function () {
				var shown = false;
				var show = function (title, detail) {
					if (shown) return;
					shown = true;
					document.body.style.display = '';
					var box = document.createElement('pre');
					box.style.cssText = 'padding:16px;color:#f66;background:#111;white-space:pre-wrap;font-size:12px;';
					box.textContent = title + '\n\n' + detail;
					document.body.appendChild(box);
				};
				window.addEventListener('error', function (e) {
					show('The OpenTaiko Hub failed to start (error):', (e.message || '') + '\n' + (e.error && e.error.stack ? e.error.stack : ''));
				});
				window.addEventListener('unhandledrejection', function (e) {
					var reason = e.reason || {};
					show('The OpenTaiko Hub failed to start (rejection):', reason.stack || reason.message || String(reason));
				});
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
